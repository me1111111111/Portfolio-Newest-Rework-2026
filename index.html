<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-text="site.title">Portfolio</title>
  <meta name="description" content="My portfolio: illustration, design and creative projects.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Doodle icons (reused everywhere with <use href="#i-...">) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-star" viewBox="0 0 64 64"><polygon points="32,4 39,24 60,24 43,37 50,58 32,45 14,58 21,37 4,24 25,24" fill="currentColor" stroke="#111" stroke-width="3" stroke-linejoin="round"/></symbol>
      <symbol id="i-flower" viewBox="0 0 64 64"><g fill="currentColor" stroke="#111" stroke-width="3"><circle cx="32" cy="16" r="11"/><circle cx="48" cy="32" r="11"/><circle cx="32" cy="48" r="11"/><circle cx="16" cy="32" r="11"/></g><circle cx="32" cy="32" r="8" fill="#ffd23f" stroke="#111" stroke-width="3"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 64 64"><path d="M8 56 C8 24 28 8 58 8 C58 38 40 58 8 56Z" fill="currentColor" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M8 56 L40 24" stroke="#111" stroke-width="3" fill="none"/></symbol>
      <symbol id="i-smile" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="currentColor" stroke="#111" stroke-width="3"/><circle cx="23" cy="26" r="3.5" fill="#111"/><circle cx="41" cy="26" r="3.5" fill="#111"/><path d="M18 38 Q32 52 46 38" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
      <symbol id="i-clip" viewBox="0 0 64 64"><path d="M22 34 L38 18 C44 12 54 22 46 30 L28 48 C22 54 12 46 18 38 L34 22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 64 64"><path d="M10 54 L14 40 L44 10 L54 20 L24 50Z" fill="#ffd23f" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M44 10 L54 20 L58 16 L48 6Z" fill="currentColor" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M10 54 L14 40 L24 50Z" fill="#fff3d0" stroke="#111" stroke-width="3" stroke-linejoin="round"/></symbol>
      <symbol id="i-plane" viewBox="0 0 64 64"><path d="M4 30 L60 8 L38 58 L30 38 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M30 38 L60 8" stroke="#111" stroke-width="3"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 64 64"><path d="M32 6 C18 6 12 18 14 28 C16 36 22 38 22 46 L42 46 C42 38 48 36 50 28 C52 18 46 6 32 6Z" fill="#ffd23f" stroke="#111" stroke-width="3"/><rect x="24" y="48" width="16" height="7" fill="currentColor" stroke="#111" stroke-width="3"/><rect x="26" y="56" width="12" height="4" fill="#111"/></symbol>
      <symbol id="i-frame" viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="4" fill="#fff" stroke="#111" stroke-width="3"/><line x1="6" y1="20" x2="58" y2="20" stroke="#111" stroke-width="3"/><rect x="12" y="26" width="18" height="22" fill="currentColor" opacity=".35" stroke="#111" stroke-width="2"/><line x1="36" y1="30" x2="52" y2="30" stroke="#111" stroke-width="3"/><line x1="36" y1="40" x2="50" y2="40" stroke="#111" stroke-width="3"/></symbol>
      <symbol id="i-rosette" viewBox="0 0 64 64"><path d="M22 40 L16 60 L26 54 L32 62 L38 54 L48 60 L42 40Z" fill="#ffd23f" stroke="#111" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="26" r="18" fill="currentColor" stroke="#111" stroke-width="3"/><circle cx="32" cy="26" r="9" fill="#fff" stroke="#111" stroke-width="2.5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 64 64"><path d="M6 32 L54 32 M38 16 L56 32 L38 48" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 64 64"><path d="M32 4 Q36 28 60 32 Q36 36 32 60 Q28 36 4 32 Q28 28 32 4Z" fill="currentColor" stroke="#111" stroke-width="3" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- ============ ENTRY SCREEN ============ -->
  <div class="intro" id="intro">
    <div class="deco-layer" aria-hidden="true">
      <span class="tape blue" style="top:7%;left:6%;--r:-14deg;width:150px"></span>
      <span class="tape green" style="top:9%;right:5%;--r:18deg;width:140px"></span>
      <span class="tape red" style="bottom:12%;left:4%;--r:-8deg;width:120px"></span>
      <svg class="deco" style="top:14%;left:14%;width:64px;height:64px;color:var(--red);--r:-10deg"><use href="#i-star"/></svg>
      <svg class="deco" style="bottom:10%;left:10%;width:84px;height:84px;color:var(--green);--r:12deg"><use href="#i-flower"/></svg>
      <svg class="deco" style="top:52%;right:12%;width:64px;height:64px;color:var(--blue);--r:6deg"><use href="#i-smile"/></svg>
      <svg class="deco" style="top:44%;left:6%;width:60px;height:60px;color:var(--red);--r:-20deg"><use href="#i-clip"/></svg>
      <svg class="deco" style="bottom:30%;right:16%;width:110px;height:110px;--r:38deg"><use href="#i-pencil"/></svg>
      <svg class="deco" style="bottom:6%;left:30%;width:60px;height:60px;--r:-12deg"><use href="#i-plane"/></svg>
      <svg class="deco" style="top:26%;right:20%;width:44px;height:44px;color:var(--yellow);--r:0deg"><use href="#i-sparkle"/></svg>
      <svg class="deco" style="top:20%;right:38%;width:54px;height:54px;color:var(--green);--r:-18deg"><use href="#i-leaf"/></svg>
      <svg class="deco" style="bottom:18%;right:27%;width:58px;height:58px;color:var(--yellow);--r:14deg"><use href="#i-star"/></svg>
      <div class="deco sticker entry-sticker" data-text="entry.makeStuff" style="top:31%;left:25%;--r:-7deg">make stuff!</div>
      <div class="deco sticker entry-sticker pink" data-text="entry.yay" style="bottom:22%;right:28%;--r:8deg">★ yay ★</div>
      <img class="deco polaroid" src="assets/images/placeholder-landscape.svg" alt="" style="top:12%;left:4%;--r:-7deg;width:150px">
      <img class="deco polaroid" src="assets/images/placeholder-landscape.svg" alt="" style="bottom:24%;right:5%;--r:8deg;width:130px">
      <div class="deco note-sticky" data-text="entry.hello" style="bottom:8%;right:6%;--r:6deg">hello!</div>
    </div>

    <div class="scraps" id="scraps"></div>
    <div class="click-confetti" id="intro-confetti" aria-hidden="true"></div>

    <main class="cover">
      <button class="folder" id="folder" type="button" data-attr="aria-label:entry.openFolder">
        <span class="f-tab"></span>
        <span class="f-back"></span>
        <span class="f-papers"><i></i><i></i><i></i></span>
        <span class="f-front">
          <span class="f-label"></span>
        </span>
        <span class="binder" aria-hidden="true"></span>
      </button>
      <h1 class="cover-title" data-colorize="red,green,yellow,blue" data-text="navigation.brand">Portfolio</h1>
      <p class="hint" data-text="entry.hint">Click to open</p>
    </main>
  </div>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- ============ SITE ============ -->
  <div class="site" id="site" hidden>
    <audio id="site-music" src="assets/music/music.mp3" loop preload="auto" data-attr="aria-label:ui.musicLabel"></audio>
    <div class="paper-rain" id="paper-rain" aria-hidden="true"></div>
    <div class="click-confetti" id="click-confetti" aria-hidden="true"></div>
    <div class="sound-controls">
      <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="true" data-text="ui.audioOn">♫ sound on</button>
      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" data-attr="aria-label:ui.openSettings">⚙</button>
      <div class="settings-panel" id="settings-panel" hidden>
        <strong data-text="ui.settings">Settings</strong>
        <label class="volume-control" for="bgm-volume"><span data-text="ui.bgmVolume">BGM volume</span>
          <input id="bgm-volume" type="range" min="0" max="100" value="35">
        </label>
        <label><input id="particles-toggle" type="checkbox" checked> <span data-text="ui.fallingParticles">falling particles</span></label>
        <label><input id="physics-toggle" type="checkbox" checked> <span data-text="ui.stringPhysics">string physics</span></label>
      </div>
    </div>

    <header class="topbar">
      <a class="brand" href="#about" data-colorize="red,blue,green,yellow" data-text="navigation.brand">Portfolio</a>
      <nav class="nav">
        <a class="tag red" href="#about" data-text="navigation.about">About</a>
        <a class="tag blue" href="#work" data-text="navigation.work">Work</a>
        <a class="tag yellow" href="#certificates" data-text="navigation.certificates">Certificates</a>
        <a class="tag green" href="#contact" data-text="navigation.contact">Contact</a>
      </nav>
    </header>

    <main class="main" id="main">
      <svg class="strings" id="strings" aria-hidden="true"></svg>
      <div class="paper-traveler" id="paper-traveler" aria-hidden="true">
        <img src="assets/images/oc-smallfungus.png" alt="">
      </div>

      <!-- 1. About (the file in front of the big folder) -->
      <section class="hero" id="about">
        <div class="hero-folder" aria-hidden="true"></div>

        <article class="sheet hero-paper" id="hero-paper">
          <svg class="deco" style="top:-26px;left:-24px;width:62px;height:62px;color:var(--red);--r:-12deg"><use href="#i-star"/></svg>
          <svg class="deco" style="bottom:-22px;left:-18px;width:70px;height:70px;color:var(--green);--r:10deg"><use href="#i-flower"/></svg>
          <svg class="deco" style="top:30%;right:-22px;width:50px;height:50px;color:var(--blue);--r:0deg"><use href="#i-smile"/></svg>
          <svg class="deco" style="top:16%;left:-34px;width:48px;height:48px;color:var(--yellow);--r:16deg"><use href="#i-sparkle"/></svg>
          <svg class="deco" style="bottom:16%;right:-34px;width:56px;height:56px;color:var(--red);--r:-12deg"><use href="#i-star"/></svg>
          <span class="tape blue" style="top:-14px;left:14%;--r:-6deg;width:130px"></span>
          <span class="tape red" style="top:-12px;right:18%;--r:5deg;width:100px"></span>
          <span class="tape green" style="bottom:-12px;right:6%;--r:-4deg;width:120px"></span>

          <div class="hero-grid">
            <div class="hero-text">
              <h2 class="hello" data-colorize="red,blue,green,yellow" data-text="hero.greeting">Hello, I'm</h2>
              <h1 class="name" data-bind="name" data-colorize="red,blue,green,white">[Your name]</h1>
              <p class="label-tag" data-text="navigation.heroLabel">A little about me</p>
              <p class="body tagline" data-bind="tagline"></p>
              <div class="intro-card">
                <p class="body" data-bind="intro"></p>
              </div>
            </div>
          </div>

          <figure class="hero-oc">
            <span class="comic-burst" aria-hidden="true"></span>
            <button class="oc-btn" id="oc-btn" type="button" data-attr="aria-label:ui.meetOc">
              <img id="oc" data-attr="alt:ui.ocAltFallback">
            </button>
            <span class="oc-note" data-text="ui.clickToMeetOc">click to meet my OC</span>
          </figure>
        </article>
      </section>

      <!-- 2. What I do -->
      <section class="sheet hang spiral" id="services">
        <header class="sec-head">
          <h2 class="topic" data-colorize="red,blue,green,white" data-text="navigation.servicesTitle">What I do</h2>
          <p class="label-tag tilt" data-text="navigation.servicesSubtitle">Ideas into things</p>
        </header>
        <div class="grid-3" id="services-list"></div>
      </section>

      <!-- 3. Selected work -->
      <section class="sheet hang" id="work">
        <span class="tape yellow" style="top:-12px;left:8%;--r:-4deg;width:120px"></span>
        <header class="sec-head">
          <h2 class="topic" data-colorize="red,blue,green,white" data-text="navigation.workTitle">Selected work</h2>
          <p class="label-tag tilt" data-text="navigation.workSubtitle">Made by me</p>
        </header>
        <div class="grid-2" id="projects-list"></div>
      </section>

      <!-- 4. Certificates -->
      <section class="sheet hang" id="certificates">
        <span class="tape green" style="top:-12px;right:10%;--r:5deg;width:120px"></span>
        <header class="sec-head">
          <h2 class="topic" data-colorize="red,blue,green,white" data-text="navigation.certificatesTitle">Certificates</h2>
          <p class="label-tag tilt" data-text="navigation.certificatesSubtitle">Learning and badges</p>
        </header>
        <div class="grid-2" id="certs-list"></div>
      </section>

      <!-- 5. Contact -->
      <section class="sheet hang" id="contact">
        <figure class="page-oc" data-page-oc>
          <span class="comic-burst" aria-hidden="true"></span>
          <button class="page-oc-btn" type="button" data-attr="aria-label:ui.clickLittleOc">
            <img src="assets/images/oc-fungusverysmall.png" alt="">
          </button>
        </figure>
        <svg class="deco" style="top:-30px;right:-20px;width:70px;height:70px;color:var(--yellow);--r:12deg"><use href="#i-sparkle"/></svg>
        <header class="sec-head contact-head">
          <p class="burst label-tag" data-text="navigation.contactTitle">Let's connect</p>
        </header>
        <figure class="photo-frame">
          <span class="photo-tape"></span>
          <img src="assets/images/oc-iconfungus.gif" data-attr="alt:ui.frameAlt">
          <figcaption data-text="ui.tinyMe">tiny me!</figcaption>
        </figure>
        <div class="contact-list" id="contact-list"></div>
      </section>

      <footer class="foot">
        <span data-text="ui.footer">Made with colour and tape by</span> <span data-bind="name">[Your name]</span>
      </footer>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
